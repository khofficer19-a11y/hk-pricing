<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H&amp;K Pricing Template</title>
<meta name="description" content="Enter the Tier 1 to 4 prices for new items.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="H&amp;K Distribution">
<meta property="og:title" content="H&amp;K Pricing Template">
<meta property="og:description" content="Enter the Tier 1 to 4 prices for the new items and send them back.">
<meta property="og:url" content="https://khofficer19-a11y.github.io/hk-pricing/">
<meta property="og:image" content="https://khofficer19-a11y.github.io/hk-pricing/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#f7f3e8; --surface:#fffdf8; --surface2:#faf6ea; --fg:#17150d; --muted:#6f6a58; --line:#e6dfc8; --line2:#d3c9a4;
  --gold:#b88f12; --gold-d:#8f6d08; --gold-l:#e2c25a; --gold-ink:#1a1505; --gold-soft:#f6ecc9; --ink:#14120c; --cream:#efe8cf;
  --good:#1b7a45; --good-soft:#e2f2e6; --warn:#a15a00; --warn-soft:#fbe9cf; --bad:#b3261e; --bad-soft:#fbe3e0; --blue:#1f4e8c; --blue-soft:#e3ecf8;
  --shadow:0 1px 2px rgba(30,25,5,.06),0 10px 28px rgba(30,25,5,.07);
  --serif:"Playfair Display","Times New Roman",Georgia,serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
  --goldgrad:linear-gradient(135deg,#e6c964 0%,#b88f12 55%,#9c7608 100%);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f0e09; --surface:#1a1810; --surface2:#15130c; --fg:#f4f0e0; --muted:#a9a48f; --line:#34322a; --line2:#4a4530;
  --gold:#d9b23a; --gold-d:#e9c657; --gold-l:#f0d67a; --gold-soft:#34301a; --ink:#080704;
  --good:#62d08f; --good-soft:#16301d; --warn:#f0b35a; --warn-soft:#38290f; --bad:#ff8a80; --bad-soft:#3b1a17; --blue:#8db8f2; --blue-soft:#18273d;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.top{background:var(--ink)}
.top .wrap{display:flex;justify-content:center;padding-top:22px;padding-bottom:8px}
.brand img{height:76px;width:auto;max-width:78vw;display:block;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.herow{background:radial-gradient(120% 140% at 50% 0%,#241f10 0%,var(--ink) 62%);color:var(--cream);position:relative}
.herow::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--goldgrad)}
.hero{padding-top:14px;padding-bottom:26px;text-align:center}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,7.5vw,40px);line-height:1.1;margin:0;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto;max-width:260px}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-l))}
.orn::after{transform:scaleX(-1)}
.orn i{width:7px;height:7px;background:var(--gold-l);transform:rotate(45deg)}
.hero .sub{color:#d6cfb4;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.hero p{margin:12px auto 0;color:#d6cfb4;max-width:52ch}
.hero p b{color:var(--gold-l)}
.sum{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.sum span{border:1px solid rgba(226,194,90,.4);border-radius:999px;padding:6px 12px;font-size:13px;color:#e8e2cc}
.sum span b{color:var(--gold-l);font-family:var(--serif);font-size:16px;margin-right:3px}
.sum span.hl{background:rgba(226,194,90,.16);border-color:var(--gold-l)}
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px}
.tools.stuck{box-shadow:0 8px 14px -12px rgba(30,25,5,.45);border-bottom:1px solid var(--line2)}
.search{position:relative}
.search input{width:100%;font-size:16px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:12px 14px 12px 42px;min-width:0}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.chip small{color:var(--gold-d);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.chip[aria-pressed="true"] small{color:var(--gold-l)}
.list{display:grid;gap:12px;margin-top:12px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;min-width:0}
.it.done{border-color:var(--good)}
.top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph{flex:none;width:68px;height:68px;border-radius:12px;overflow:hidden;border:1px solid var(--line2);padding:0;background:#fff;box-shadow:var(--shadow)}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.tx{flex:1;min-width:0}
#lb{position:fixed;inset:0;z-index:60;background:rgba(8,7,3,.86);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;border-radius:12px;background:#fff;object-fit:contain}
#lb p{color:#efe8cf;margin:0;text-align:center;font-size:14px;max-width:90vw}
.nm{font-weight:700;font-size:15.5px;line-height:1.3;word-break:break-word}
.up{color:var(--muted);font-size:12px;margin-top:2px}
.cst{flex:none;text-align:right;background:var(--gold-soft);border-radius:10px;padding:5px 10px}
.cst small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.cst b{font-family:var(--serif);font-size:18px}
.mx{border-radius:12px;padding:10px 12px;font-size:13.5px;display:grid;gap:8px}
.mx.ok{background:var(--good-soft);color:var(--good)}
.mx.ok span{color:var(--muted);font-size:12.5px;margin-left:6px}
.mx.q{background:var(--warn-soft)}
.mx.q.chk{background:var(--bad-soft)}
.mx.q.nn{background:var(--blue-soft)}
.mx .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.mx.chk .lbl{color:var(--bad)} .mx.nn .lbl{color:var(--blue)}
.mx q{font-style:normal;font-weight:700}
.ch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch button{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:700;font-size:13.5px}
.ch button[aria-pressed="true"].a{background:var(--good);border-color:var(--good);color:#fff}
.ch button[aria-pressed="true"].e{background:var(--blue);border-color:var(--blue);color:#fff}
.ch button[aria-pressed="true"].r{background:var(--bad);border-color:var(--bad);color:#fff}
.ch button[aria-pressed="true"].n{background:var(--gold);border-color:var(--gold-d);color:var(--gold-ink)}
.dtx{width:100%;font-size:16px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:10px;min-width:0}
.kn{border-left:3px solid var(--gold);background:var(--surface2);border-radius:0 10px 10px 0;padding:8px 10px;font-size:13px}
.kn b{color:var(--gold-d)}
.addn{justify-self:start;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:2px 0}
.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.tiers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tr{display:grid;gap:4px;min-width:0}
.tr label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tr input{width:100%;font-size:16px;font-weight:600;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:10px;min-width:0;font-variant-numeric:tabular-nums}
.tr .mg{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);min-height:18px}
.tr .mg b{color:var(--good);font-weight:700}.tr .mg b.neg{color:var(--bad)}
.rule{font-size:12px;color:var(--muted)}
.extra{background:var(--blue-soft);border:1px dashed var(--blue);border-radius:16px;padding:14px;display:grid;gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--cream);border-top:2px solid var(--gold);box-shadow:0 -10px 28px rgba(0,0,0,.35);padding:11px 0 calc(11px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pg small{display:block;color:#b8b19a;font-size:12px;line-height:1.2}
.pg b{font-family:var(--serif);font-size:18px;color:var(--gold-l)}
.btn{border:1px solid var(--gold-d);background:var(--goldgrad);color:var(--gold-ink);border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(184,143,18,.35)}
.btn.alt{background:transparent;color:var(--gold-l);box-shadow:none;border-color:var(--gold-l)}
.status{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:13.5px;z-index:40;max-width:90vw;text-align:center}
.status.err{border-color:var(--bad);color:#ffd2cd}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.foot{margin:26px 0 6px;text-align:center;color:var(--muted);font-size:12.5px}
[hidden]{display:none!important}
</style>
</head>

  function qText(it){

    h+='<div class="tools" id="tools"'+(small?' hidden':'')+'><div class="wrap"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search product or UPC" autocomplete="off"></div><div class="chips" role="group" aria-label="Filter"><button class="chip" data-f="all" aria-pressed="true">All <small id="c_all"></small></button><button class="chip" data-f="open" aria-pressed="false">To answer <small id="c_open"></small></button><button class="chip" data-f="unpriced" aria-pressed="false">Not priced <small id="c_unpriced"></small></button><button class="chip" data-f="priced" aria-pressed="false">Priced <small id="c_priced"></small></button></div></div></div>';

    root.innerHTML=h;
    var bar=document.createElement("div");bar.className="bar";bar.innerHTML='<div class="wrap"><div class="pg"><small id="pgs"></small><b id="pgb"></b></div>'+(review?'':'<button class="btn" id="sendwa">Send on WhatsApp</button>')+'<button class="btn'+(review?'':' alt')+'" id="send">'+(review?'Send as PDF':'PDF')+'</button></div>';document.body.appendChild(bar);
    var cn={};CAT.items.forEach(function(i){cn[i.m]=(cn[i.m]||0)+1});var qn=(cn.check||0)+(cn.none||0)+(cn.twice||0)+(cn.extra||0);

    document.getElementById("sum").innerHTML='<span><b>'+n+'</b> products</span><span><b>'+(cn.cert||0)+'</b> matched 100%</span><span><b>'+(cn.prob||0)+'</b> probable (pre-approved)</span><span class="hl"><b>'+qn+'</b> questions for you</span>';

  }
  function calc(it){
    var t=tiers(it);
    for(var k=0;k<4;k++){var m=margin(it.c,t[k]),b=document.getElementById("m_"+it.id+"_"+k),u=document.getElementById("u_"+it.id+"_"+k);if(!b)continue;
      if(m){b.textContent=m.pct.toFixed(1)+"%";b.className=m.pct<0?"neg":"";u.textContent=(m.usd<0?"-":"")+money(Math.abs(m.usd))}else{b.textContent="";u.textContent=""}}
    var el=document.getElementById("i_"+it.id);if(el)el.classList.toggle("done",priced(it)&&answered(it));
  }
  function prog(){
    var n=CAT.items.filter(pricable).length,p=0,q=0,o=0;
    CAT.items.forEach(function(it){if(pricable(it)&&priced(it))p++;if(isQ(it)){q++;if(!answered(it))o++}});
    document.getElementById("pgb").textContent=p+" of "+n+" priced";document.getElementById("pgs").textContent=q?(q-o)+" of "+q+" questions answered":(CAT.date||"");
    document.getElementById("c_all").textContent=CAT.items.length;document.getElementById("c_open").textContent=o;document.getElementById("c_unpriced").textContent=n-p;document.getElementById("c_priced").textContent=p;
    return {p:p,n:n,q:q,o:o};
  }
  function applyFilter(){
    var t=term.trim().toLowerCase(),vis=0;
    CAT.items.forEach(function(it){var el=document.getElementById("i_"+it.id),ok=true;
      if(t&&el.getAttribute("data-s").indexOf(t)<0)ok=false;
      if(filter==="open"&&!(isQ(it)&&!answered(it)))ok=false;
      if(filter==="unpriced"&&(!pricable(it)||priced(it)))ok=false;
      if(filter==="priced"&&(!pricable(it)||!priced(it)))ok=false;
      el.hidden=!ok;if(ok)vis++});
    document.getElementById("none").hidden=vis>0;
  }
  function refreshItem(id){var it=find(id),el=document.getElementById("i_"+id),keep=document.activeElement;var hid=el.hidden;el.outerHTML=itemHtml(it);el=document.getElementById("i_"+id);el.hidden=hid;calc(it);prog()}
  function status(t,err){var s=document.getElementById("st");if(!s){s=document.createElement("div");s.id="st";s.setAttribute("role","status");document.body.appendChild(s)}s.className="status"+(err?" err":"");s.textContent=t;s.hidden=false;clearTimeout(status.t);status.t=setTimeout(function(){s.hidden=true},5000)}
  function loadScript(src){return new Promise(function(res,rej){var el=document.createElement("script");el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el)})}
  function pdfReady(){return !!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable)}
  var pdfP=null;function pdfLibs(){if(pdfReady())return Promise.resolve();if(!pdfP)pdfP=loadScript(PDFJS).then(function(){return loadScript(PDFAT)}).catch(function(e){pdfP=null;throw e});return pdfP}
  function reviewText(it){
    if(it.m==="cert") return "Matched 100%"+(NT[it.id]?" - Note: "+NT[it.id]:"");
    var c0=cur(it),d=D[it.id]||{c:"",t:""};if(!c0) return "NOT ANSWERED";d={c:c0,t:d.t};
    if(it.m==="extra")return d.c==="a"?"Add to our PO"+(d.t?" - "+d.t:""):(d.c==="r"?"Not received"+(d.t?" - "+d.t:""):"Note: "+(d.t||"-"));
    return d.c==="a"?"Approved"+(d.t?" - "+d.t:""):(d.c==="e"?"Edit: ":"Note: ")+(d.t||"-");
  }
  function makePdf(){
    var J=window.jspdf.jsPDF,doc=new J({unit:"pt",format:"letter",orientation:"landscape"}),W=792,pr=prog();
    doc.setFillColor(20,18,12);doc.rect(0,0,W,70,"F");doc.setFillColor(184,143,18);doc.rect(0,70,W,3,"F");
    try{var im=document.querySelector(".brand img"),r=(im.naturalWidth||3)/(im.naturalHeight||1),h=44,w=Math.min(150,h*r);doc.addImage(LOGO,"PNG",36,13,w,h)}catch(e){}
    doc.setFont("times","bold");doc.setFontSize(18);doc.setTextColor(226,194,90);doc.text("PRICES AND REVIEW",W-36,36,{align:"right"});
    doc.setFont("times","normal");doc.setFontSize(10);doc.setTextColor(230,224,200);doc.text(CAT.title+"    "+new Date().toLocaleString("en-US",{month:"numeric",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}),W-36,54,{align:"right"});
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(40,36,24);
    var rv0=CAT.items.some(function(i){return i.m!=="plain"}),cn2={},chg=0;CAT.items.forEach(function(i){cn2[i.m]=(cn2[i.m]||0)+1;if(i.m==="prob"){var dd=D[i.id];if(dd&&(dd.c==="e"||dd.c==="n"))chg++}});
    var qn2=(cn2.check||0)+(cn2.none||0)+(cn2.twice||0)+(cn2.extra||0);
    if(rv0)doc.autoTable({startY:102,theme:"plain",body:[["Products",String(pr.n),"Matched 100%",String(cn2.cert||0),"Probable (pre-approved)",String(cn2.prob||0)+" (changed: "+chg+")"],["Priced",pr.p+" of "+pr.n,"Questions",(pr.q-pr.o)+" of "+pr.q+" answered","Not answered",String(pr.o)]],styles:{font:"helvetica",fontSize:9,cellPadding:3,textColor:[40,36,24]},columnStyles:{0:{fontStyle:"bold"},2:{fontStyle:"bold"},4:{fontStyle:"bold"}},margin:{left:36,right:36}});
    var body=[],rv=CAT.items.some(function(i){return i.m!=="plain"});
    if(!rv){CAT.items.forEach(function(it,i){var t=tiers(it),row=[String(i+1),it.n,it.u||"",it.c!=null?money(it.c):""];for(var k=0;k<4;k++){var m=margin(it.c,t[k]);row.push(num(t[k])>0?money(num(t[k]))+(m?" ("+m.pct.toFixed(1)+"%)":""):"")}body.push(row)});
      doc.autoTable({startY:102,head:[["#","Item","UPC","Cost","Tier 1","Tier 2","Tier 3","Tier 4"]],body:body,theme:"grid",styles:{font:"helvetica",fontSize:9,cellPadding:4,lineColor:[221,214,186],lineWidth:.3,textColor:[30,28,18]},headStyles:{fillColor:[20,18,12],textColor:[226,194,90],fontStyle:"bold"},columnStyles:{0:{cellWidth:22,halign:"right"},3:{halign:"right"},4:{halign:"right"},5:{halign:"right"},6:{halign:"right"},7:{halign:"right"}},margin:{left:36,right:36,bottom:40}});
      var n0=doc.getNumberOfPages();for(var i0=1;i0<=n0;i0++){doc.setPage(i0);doc.setFont("times","italic");doc.setFontSize(8.5);doc.setTextColor(110,106,88);doc.text("H&K Distribution - new item prices. Tier 5 and Standard equal Tier 4.",36,596);doc.text("Page "+i0+" of "+n0,W-36,596,{align:"right"})}
      return doc}
    CAT.items.forEach(function(it,i){var t=tiers(it),m4=margin(it.c,t[3]);
      body.push([it.m==="extra"?"+":String(i+1),it.n+(it.m==="extra"?" (on the invoice, not in our receiving record)":""),it.u||"",it.c!=null?money(it.c):"",t[0]?money(num(t[0])||0):"",t[1]?money(num(t[1])||0):"",t[2]?money(num(t[2])||0):"",t[3]?money(num(t[3])||0):"",m4?m4.pct.toFixed(1)+"%":"",reviewText(it)])});
    doc.autoTable({startY:doc.lastAutoTable.finalY+10,head:[["#","Product","UPC","Cost","T1","T2","T3","T4","T4 margin","Review"]],body:body,theme:"grid",
      styles:{font:"helvetica",fontSize:7.6,cellPadding:3,lineColor:[221,214,186],lineWidth:.3,textColor:[30,28,18],overflow:"linebreak"},
      headStyles:{fillColor:[20,18,12],textColor:[226,194,90],fontStyle:"bold"},
      columnStyles:{0:{cellWidth:22,halign:"right"},1:{cellWidth:215},2:{cellWidth:70},3:{cellWidth:40,halign:"right"},4:{cellWidth:38,halign:"right"},5:{cellWidth:38,halign:"right"},6:{cellWidth:38,halign:"right"},7:{cellWidth:38,halign:"right"},8:{cellWidth:38,halign:"right"},9:{cellWidth:"auto"}},
      didParseCell:function(d){if(d.section==="body"&&d.column.index===9){var tx=String(d.cell.raw);if(tx==="NOT ANSWERED"){d.cell.styles.fillColor=[251,227,224];d.cell.styles.fontStyle="bold"}else if(tx.indexOf("Matched")===0)d.cell.styles.textColor=[27,122,69];else if(tx.indexOf("Edit")===0)d.cell.styles.fillColor=[227,236,248];else if(tx.indexOf("Not received")===0)d.cell.styles.fillColor=[251,227,224];else if(tx.indexOf("Note")===0)d.cell.styles.fillColor=[246,236,201]}},
      margin:{left:36,right:36,bottom:40}});
    var n=doc.getNumberOfPages();for(var i=1;i<=n;i++){doc.setPage(i);doc.setFont("times","italic");doc.setFontSize(8.5);doc.setTextColor(110,106,88);doc.text("H&K Distribution - prices and review. Tier 5 and Standard equal Tier 4.",36,596);doc.text("Page "+i+" of "+n,W-36,596,{align:"right"})}
    return doc;
  }
  function waText(){var L=["New item prices - "+(CAT.date||new Date().toLocaleDateString("en-US")),""];CAT.items.forEach(function(it,i){var t=tiers(it),parts=[];for(var k=0;k<4;k++){var m=margin(it.c,t[k]);parts.push("T"+(k+1)+" "+(num(t[k])!==null&&num(t[k])>0?money(num(t[k]))+(m?" ("+m.pct.toFixed(1)+"%)":""):"-"))}L.push((i+1)+") "+it.n+(it.u?" ("+it.u+")":""));L.push("Cost "+(it.c!=null?money(it.c):"-")+"  |  "+parts.join("  "));if(!priced(it))L.push("(not all prices entered)");L.push("")});return L.join("\n").trim()}
  function sendWa(){var any=CAT.items.some(function(i){return pricable(i)&&tiers(i).some(function(v){return num(v)>0})});if(!any){status("Please enter at least one price first.",true);return}window.open("https://wa.me/16168011314?text="+encodeURIComponent(waText()),"_blank");status("WhatsApp opened. Press Send there to finish.")}
  function sendPdf(){
    if(!pdfReady()){status("Preparing your PDF...");pdfLibs().then(sendPdf).catch(function(){status("Could not make the PDF. Please try again.",true)});return}
    var pr=prog(),doc=makePdf(),name="HK-Price-Review-"+(CAT.title||"list").replace(/[^A-Za-z0-9]+/g,"-")+".pdf",file=new File([doc.output("blob")],name,{type:"application/pdf"});

    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"H&K price review",text:"Prices and review - "+CAT.title+" ("+pr.p+" of "+pr.n+" priced)"}).catch(function(e){if(e&&e.name==="AbortError")return;dl()})}
    else dl();
  }
  document.addEventListener("click",function(e){

    if(b.dataset.f){filter=b.dataset.f;document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c===b))});applyFilter();return}
    if(b.dataset.c){var p=b.dataset.c.split("|"),id=p[0],c=p[1],d=D[id]||{c:"",t:""};if(d.c===c){d.c=""}else d.c=c;D[id]=d;save();refreshItem(id);var inp=document.querySelector('[data-t="'+id+'"]');if(inp&&!inp.hidden)inp.focus();return}
    if(b.dataset.addn){NT[b.dataset.addn]="";save();refreshItem(b.dataset.addn);var i=document.querySelector('[data-nt="'+b.dataset.addn+'"]');if(i)i.focus();return}
  });
  document.addEventListener("input",function(e){
    var el=e.target;
    if(el.id==="q"){term=el.value;applyFilter();return}
    if(el.dataset.k!==undefined&&el.dataset.id){var id=el.dataset.id,t=P[id]||["","","",""];t[+el.dataset.k]=el.value;P[id]=t;save();calc(find(id));prog();if(filter==="unpriced"||filter==="priced"){}return}

})();
