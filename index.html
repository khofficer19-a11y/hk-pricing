<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H&amp;K Pricing Template</title>
<meta name="description" content="Enter the Tier 1 to 4 prices for new items.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="H&amp;K Distribution">
<meta property="og:title" content="H&amp;K Pricing Template">
<meta property="og:description" content="Enter the Tier 1 to 4 prices for the new items and send them back.">
<meta property="og:url" content="https://khofficer19-a11y.github.io/hk-pricing/">

<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style id="css">
:root{
  --bg:#f3f2ec; --card:#ffffff; --head:#ffffff; --fg:#1d1b14; --muted:#69665a; --line:#dcd9cc;
  --gold:#b88f12; --gold-ink:#17140a; --gold-soft:#f4e8bd; --field:#faf9f4; --good:#1b7a45; --bad:#b3261e;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#15140e; --card:#201f17; --head:#1b1a13; --fg:#f2f0e6; --muted:#a4a090; --line:#3a382c;
  --gold:#d9b23a; --gold-ink:#17140a; --gold-soft:#3a3216; --field:#17160f; --good:#62d08f; --bad:#ff8a80; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.band{background:var(--head);border-bottom:3px solid var(--gold);padding:14px 16px}
.band-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.band img{height:46px;width:auto;display:block}
.band h1{font-family:var(--display);font-size:20px;line-height:1.15;margin:0}
.band p{margin:2px 0 0;color:var(--muted);font-size:13px}
.main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:18px 16px 48px}
.intro{display:flex;flex-direction:column;gap:6px}
.intro b{font-family:var(--display);font-size:17px}
.intro span{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-name{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25;word-break:break-word}
.upc{color:var(--muted);font-size:12px;margin-top:2px}
.cost{background:var(--gold-soft);border-radius:8px;padding:6px 10px;text-align:right;flex:none}
.cost small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.cost strong{font-family:var(--display);font-size:18px}
.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.tiers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tier{display:flex;flex-direction:column;gap:6px;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600;min-width:0}
input{font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px 10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.m{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;min-height:28px}
.m b{font-size:15px;color:var(--good);font-weight:600}
.m b.neg{color:var(--bad)} .m b.none{color:var(--muted);font-weight:400}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--field);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--good);border-color:var(--good)}
.tag{display:inline-block;background:var(--gold-soft);font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:12px 16px;cursor:pointer}
button.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
button.link{border:0;background:none;color:var(--muted);font-weight:500;padding:4px 6px;font-size:13px;text-decoration:underline}
.send{display:flex;flex-direction:column;gap:8px}
.send button{width:100%;font-size:16px;padding:14px}
.status{min-height:20px;font-size:13px;color:var(--good)} .status.err{color:var(--bad)}
.hint{color:var(--muted);font-size:13px}
.admin{border-style:dashed}
.admin h2{font-family:var(--display);font-size:16px;margin:0}
.draft{display:grid;grid-template-columns:1fr 100px;gap:8px}
.draft .upc-in{grid-column:1 / -1}
@media(min-width:620px){.draft{grid-template-columns:2fr 1.2fr 100px}.draft .upc-in{grid-column:auto}}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.foot{text-align:center}
</style>
</head>

  var KEY="hk-pricing-file-prices-v1", DKEY="hk-pricing-file-draft-v1";

  function margin(cost,tier){var c=num(cost),t=num(tier);if(c===null||t===null||t<=0)return null;return {pct:(t-c)/t*100,usd:t-c}}
  function today(){var d=new Date();return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear()}
  function tiersOf(id){return prices[id]||["","","",""]}
  function filled(id){return tiersOf(id).filter(function(v){return num(v)!==null&&num(v)>0}).length}
  function setStatus(id,t,err){var s=document.getElementById(id);if(s){s.textContent=t;s.className="status"+(err?" err":"")}}
  function findItem(id){return (STATE.items||[]).filter(function(i){return i.id===id})[0]}

  function render(){
    var items=STATE.items||[];
    var onlyExample=items.length===1&&items[0].example;
    var h='<div class="band"><div class="band-in"><img src="'+LOGO+'" alt="H&amp;K Distribution"><div><h1>New Item Pricing</h1><p>H&amp;K Distribution</p></div></div></div><div class="main">';
    h+='<div class="intro"><b>'+(items.length&&!onlyExample?items.length+(items.length>1?' new items need':' new item needs')+' your tier prices':'No new items waiting')+'</b><span>Type the Tier 1 to Tier 4 selling price for each item. The margin shows under each price. Updated '+esc(STATE.updated||"")+'.</span></div>';
    if(!items.length) h+='<div class="card empty">Nothing to price right now.</div>';
    items.forEach(function(it){
      var t=tiersOf(it.id), n=filled(it.id);
      h+='<div class="card"><div class="item-top"><div>'+(it.example?'<span class="tag">Example</span><br>':'')+'<div class="item-name">'+esc(it.name)+'</div>'+(it.upc?'<div class="upc">UPC '+esc(it.upc)+'</div>':'')+'</div>'+
        '<div class="cost"><small>Cost</small><strong>'+(num(it.cost)!==null?money(num(it.cost)):"–")+'</strong></div></div><div class="tiers">';
      for(var k=0;k<4;k++){
        h+='<div class="tier"><label>Tier '+(k+1)+'<input inputmode="decimal" autocomplete="off" id="t_'+esc(it.id)+'_'+k+'" data-id="'+esc(it.id)+'" data-k="'+k+'" value="'+esc(t[k])+'" placeholder="$0.00"></label>'+
          '<div class="m"><span id="u_'+esc(it.id)+'_'+k+'"></span><b class="none" id="m_'+esc(it.id)+'_'+k+'">–</b></div></div>';
      }
      h+='</div><div class="item-top"><span class="chip'+(n===4?' ok':'')+'" id="chip_'+esc(it.id)+'">'+(n===4?'All 4 prices entered':n+' of 4 prices entered')+'</span>'+
        (owner?'<button class="link" data-remove="'+esc(it.id)+'">Remove item</button>':'')+'</div></div>';
    });
    if(items.length) h+='<div class="send"><button class="primary" id="send">Copy my prices to send</button><div class="status" id="status" role="status"></div><div class="hint">Tap the button, then paste the message into WhatsApp, a text or an email.</div></div>';
    if(owner){
      h+='<div class="card admin"><h2>Add new items</h2><div class="hint">Type the item name and the cost. Then tap Copy link for the CEO and paste the link into WhatsApp.</div>';
      drafts.forEach(function(r,i){
        h+='<div class="draft"><label>Item name<input id="dn'+i+'" data-d="'+i+'" data-f="name" value="'+esc(r.name)+'" placeholder="Product name"></label>'+
           '<label class="upc-in">UPC (optional)<input id="du'+i+'" data-d="'+i+'" data-f="upc" inputmode="numeric" value="'+esc(r.upc)+'" placeholder="UPC"></label>'+
           '<label>Cost<input id="dc'+i+'" data-d="'+i+'" data-f="cost" inputmode="decimal" value="'+esc(r.cost)+'" placeholder="$0.00"></label></div>';
      });
      h+='<div class="row"><button id="addrow">+ Another item</button><button class="primary" id="savefile">Copy link for the CEO</button></div><div class="status" id="astatus" role="status"></div></div>';
    }
    h+='<div class="foot"><button class="link" id="ownerbtn">'+(owner?'Close owner tools':'Owner tools')+'</button></div></div>';
    root.innerHTML=h;
    items.forEach(calc);
  }
  function calc(it){
    var t=tiersOf(it.id);
    for(var k=0;k<4;k++){
      var m=margin(it.cost,t[k]), b=document.getElementById("m_"+it.id+"_"+k), u=document.getElementById("u_"+it.id+"_"+k);
      if(!b) continue;
      if(m){b.textContent=m.pct.toFixed(1)+"%";b.className=m.pct<0?"neg":"";u.textContent=(m.usd<0?"-":"")+money(Math.abs(m.usd))}
      else{b.textContent="–";b.className="none";u.textContent=""}
    }
    var n=filled(it.id), chip=document.getElementById("chip_"+it.id);
    if(chip){chip.textContent=n===4?"All 4 prices entered":n+" of 4 prices entered";chip.className="chip"+(n===4?" ok":"")}
  }
  root.addEventListener("input",function(e){
    var el=e.target;
    if(el.hasAttribute("data-k")){
      var id=el.getAttribute("data-id"), k=+el.getAttribute("data-k");
      var t=tiersOf(id).slice(); t[k]=el.value; prices[id]=t; savePrices();
      var it=findItem(id); if(it) calc(it);
    } else if(el.hasAttribute("data-d")){
      drafts[+el.getAttribute("data-d")][el.getAttribute("data-f")]=el.value; saveDrafts();
    }
  });
  root.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.id==="send") return copyPrices();
    if(b.id==="ownerbtn"){owner=!owner;render();return}
    if(b.id==="addrow"){drafts.push({name:"",upc:"",cost:""});saveDrafts();render();var l=document.getElementById("dn"+(drafts.length-1));if(l)l.focus();return}
    if(b.id==="savefile") return makeLinkClick();
    if(b.hasAttribute("data-remove")){
      var id=b.getAttribute("data-remove");
      return removeItem(id);
    }
  });
  function msgText(){
    var L=["New item prices - "+today(),""];
    (STATE.items||[]).forEach(function(it,idx){
      var t=tiersOf(it.id), n=filled(it.id);
      L.push((idx+1)+") "+it.name+(it.upc?" ("+it.upc+")":""));
      var parts=[];
      for(var k=0;k<4;k++){
        var m=margin(it.cost,t[k]);
        parts.push("T"+(k+1)+" "+(num(t[k])!==null&&num(t[k])>0?money(num(t[k]))+(m?" ("+m.pct.toFixed(1)+"%)":""):"-"));
      }
      L.push("Cost "+(num(it.cost)!==null?money(num(it.cost)):"-")+"  |  "+parts.join("  "));
      if(n<4) L.push("(not all prices entered)");
      L.push("");
    });
    return L.join("\n").trim();
  }
  function copyPrices(){
    var t=msgText();
    function fallback(){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();
      setStatus("status",ok?"Copied. Now paste it into your message.":"Could not copy. Take a screenshot of this page instead.",!ok)}
    try{navigator.clipboard.writeText(t).then(function(){setStatus("status","Copied. Now paste it into your message.",false)},fallback)}catch(e){fallback()}
  }
  function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}
  function idOf(n,u,c){var s=n+"|"+u+"|"+c,h=0;for(var k=0;k<s.length;k++){h=(h*31+s.charCodeAt(k))|0}return "i"+(h>>>0).toString(36)}
  function loadState(){
    var m=/#d=([^&]+)/.exec(location.hash);
    if(m){try{var o=b64d(m[1]);return {updated:o.u,items:o.i.map(function(a){return {id:idOf(a[0],a[1],a[2]),name:a[0],upc:a[1],cost:a[2]}})}}catch(e){}}
    return {items:[{id:"example",name:"Example item (sample)",upc:"",cost:"5.00",example:true}],updated:today()};
  }
  function makeLink(items){
    var arr=items.map(function(i){return [i.name,i.upc||"",i.cost]});
    return location.origin+location.pathname+"?v=2#d="+b64e({u:today(),i:arr});
  }
  function applyItems(items){
    var link=makeLink(items);
    try{history.replaceState(null,"",link.slice(link.indexOf("#")))}catch(e){location.hash=link.slice(link.indexOf("#"))}
    STATE=loadState(); render(); return link;
  }
  function removeItem(id){
    var items=(STATE.items||[]).filter(function(i){return i.id!==id&&!i.example});
    applyItems(items); owner=true; render();
    setStatus("astatus","Removed. Copy the new link below and send it.",false); showLink(makeLink(items));
  }
  function showLink(link){
    var s=document.getElementById("astatus"); if(!s) return;
    s.innerHTML='Link ready. Copy it and paste it into WhatsApp:<br><input id="linkbox" readonly value="'+esc(link)+'" onclick="this.select()">';
  }
  function makeLinkClick(){
    var keep=(STATE.items||[]).filter(function(i){return !i.example});
    var add=drafts.filter(function(r){return r.name.trim()&&num(r.cost)!==null&&num(r.cost)>0}).map(function(r){
      return {name:r.name.trim(),upc:r.upc.trim(),cost:String(num(r.cost).toFixed(2))};
    });
    if(!add.length&&!keep.length){setStatus("astatus","Type at least one item name and its cost.",true);return}
    var items=keep.concat(add);
    drafts=[{name:"",upc:"",cost:""}]; saveDrafts();
    var link=applyItems(items); owner=true; render(); showLink(link);
    try{navigator.clipboard.writeText(link).then(function(){var s=document.getElementById("astatus");if(s)s.insertAdjacentHTML("afterbegin","<b>Copied.</b> ")},function(){})}catch(e){}
  }
  STATE=loadState();
  render();
})();
</script>
</body>
</html>
