<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H&amp;K Sales Order Request</title>
<meta name="description" content="Choose your flavors and quantities and send your order to H&amp;K Distribution.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:site_name" content="H&amp;K Distribution">
<meta property="og:title" content="H&amp;K Sales Order Request">
<meta property="og:description" content="Choose your flavors and quantities, then send your order.">
<meta property="og:image" content="https://khofficer19-a11y.github.io/hk-pricing/og_order.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#f7f3e8; --surface:#fffdf8; --surface2:#faf6ea; --fg:#17150d; --muted:#6f6a58; --line:#e6dfc8; --line2:#d3c9a4;
  --gold:#b88f12; --gold-d:#8f6d08; --gold-l:#e2c25a; --gold-ink:#1a1505; --gold-soft:#f6ecc9; --ink:#14120c; --ink2:#1d1a11; --cream:#efe8cf;
  --good:#1b7a45; --good-soft:#e2f2e6; --warn:#a15a00; --warn-soft:#fbe9cf; --bad:#b3261e;
  --shadow:0 1px 2px rgba(30,25,5,.06),0 10px 28px rgba(30,25,5,.07);
  --serif:"Playfair Display","Times New Roman",Georgia,serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
  --goldgrad:linear-gradient(135deg,#e6c964 0%,#b88f12 55%,#9c7608 100%);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f0e09; --surface:#1a1810; --surface2:#15130c; --fg:#f4f0e0; --muted:#a9a48f; --line:#2f2c20; --line2:#4a4530;
  --gold:#d9b23a; --gold-d:#e9c657; --gold-l:#f0d67a; --gold-ink:#1a1505; --gold-soft:#34301a; --ink:#080704; --ink2:#14120b; --cream:#efe8cf;
  --good:#62d08f; --good-soft:#16301d; --warn:#f0b35a; --warn-soft:#38290f; --bad:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}

/* header + hero: one black block */
.top{background:var(--ink);color:var(--cream)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:40px;width:auto;display:block;background:#fff;border-radius:8px;padding:4px 8px}
.brand b{font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-l);display:block;line-height:1.2;white-space:nowrap}
.brand span{color:#b8b19a;font-size:11.5px;letter-spacing:.06em}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--gold-l);border:1px solid rgba(226,194,90,.45);border-radius:999px;padding:5px 11px;white-space:nowrap}
.herow{background:radial-gradient(120% 140% at 50% 0%,#241f10 0%,var(--ink) 62%);color:var(--cream);border-bottom:1px solid #000;position:relative}
.herow::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--goldgrad)}
.hero{padding-top:30px;padding-bottom:34px;text-align:center}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#cfc8ac}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1.08;margin:0;letter-spacing:.01em;text-wrap:balance;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto;max-width:260px}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-l))}
.orn::after{transform:scaleX(-1)}
.orn i{width:7px;height:7px;background:var(--gold-l);transform:rotate(45deg)}
.hero p{margin:0 auto;color:#d6cfb4;max-width:46ch}
.steps{display:flex;gap:6px 14px;margin:20px 0 0;padding:0;list-style:none;flex-wrap:wrap;justify-content:center}
.steps li{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#cfc8ac}
.asof{margin-top:18px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-l);opacity:.9}
.steps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--goldgrad);color:var(--gold-ink);font-size:11.5px;letter-spacing:0}

/* sticky tools */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid transparent}
.tools.stuck{border-bottom-color:var(--line2);box-shadow:0 8px 14px -12px rgba(30,25,5,.45)}
.search{position:relative}
.search input{width:100%;font-size:16px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:13px 42px 13px 44px;min-width:0;box-shadow:var(--shadow)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:9px;font-size:20px}
.tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:600;font-size:13.5px;letter-spacing:.02em;display:flex;gap:7px;align-items:center}
.tab small{font-weight:600;color:var(--gold-d);font-size:12px}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.tab[aria-pressed="true"] small{color:var(--gold-l)}

/* groups */
.group{margin-top:26px}
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:9px;margin-bottom:12px;border-bottom:1px solid var(--gold);position:relative}
.ghead::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--line2)}
.ghead h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;line-height:1.15}
.ghead p{margin:3px 0 0;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.gprice{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold-d);letter-spacing:.02em;white-space:nowrap}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);position:relative;min-width:0}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.row.sel{background:var(--gold-soft)}
.row.sel::before{background:var(--goldgrad)}
.fl{font-weight:600;font-size:15.5px;line-height:1.25;word-break:break-word}
.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.price{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold-d);font-variant-numeric:lining-nums tabular-nums}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;letter-spacing:.04em;text-transform:uppercase}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.low{background:var(--warn-soft);color:var(--warn)}
.qty{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.qty button{width:42px;height:42px;border:0;background:none;font-size:22px;line-height:1;font-weight:500;color:var(--gold-d)}
.qty button:active{background:var(--gold-soft)}
.qty button[disabled]{opacity:.3}
.qty input{width:48px;height:42px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;padding:0;min-width:0;font-variant-numeric:tabular-nums}
.qty input::placeholder{color:var(--muted);font-weight:500}
.none{padding:34px 14px;text-align:center;color:var(--muted)}
.none b{display:block;color:var(--fg);font-family:var(--serif);font-size:18px;margin-bottom:4px}
.foot{margin:34px 0 8px;padding-top:20px;color:var(--muted);font-size:12.5px;display:grid;gap:6px;text-align:center;justify-items:center}
.foot .orn{margin:0 auto 4px;max-width:200px}
.foot b{color:var(--fg);font-family:var(--serif);letter-spacing:.2em;text-transform:uppercase;font-size:13px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--cream);border-top:2px solid var(--gold);box-shadow:0 -10px 28px rgba(0,0,0,.35);padding:11px 0 calc(11px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tot small{display:block;color:#b8b19a;font-size:12px;line-height:1.2}
.tot b{font-family:var(--serif);font-size:24px;line-height:1.15;color:var(--gold-l);font-variant-numeric:lining-nums tabular-nums}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:13px 20px;font-weight:700;font-size:15px;letter-spacing:.02em}
.btn.primary{background:var(--goldgrad);border-color:var(--gold-d);color:var(--gold-ink);box-shadow:0 4px 14px rgba(184,143,18,.35)}
.btn.primary:active{filter:brightness(.92)}
.btn.primary[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.wide{width:100%}

/* review sheet */
.scrim{position:fixed;inset:0;background:rgba(8,7,3,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:22px 22px 0 0;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .22s ease;box-shadow:0 -12px 44px rgba(0,0,0,.4);border-top:3px solid var(--gold)}
.sheet.on{transform:none}
@media(min-width:780px){.sheet{left:50%;right:auto;width:700px;transform:translate(-50%,102%);border-radius:22px;border:1px solid var(--gold)}.sheet.on{transform:translate(-50%,0);bottom:24px}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.sh-head h2{font-family:var(--serif);font-size:23px;margin:0}
.x{background:var(--surface);border:1px solid var(--line2);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
.sh-body{overflow:auto;padding:0 20px 14px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
.lines{flex:none}
.sh-foot{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);background:var(--surface);display:grid;gap:10px;border-radius:0 0 22px 22px}
.lines{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ln{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.ln:first-child{border-top:0}
.ln .n{font-weight:600;line-height:1.25;word-break:break-word}
.ln .s{color:var(--muted);font-size:12.5px}
.ln .t{font-family:var(--serif);font-weight:700;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.ln .qty{grid-column:2;justify-self:end}
.ln .t:empty{display:none}
.ln .qty button{width:34px;height:34px;font-size:18px}.ln .qty input{width:40px;height:34px;font-size:14px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px;background:var(--ink);color:var(--cream)}
.sum b{font-family:var(--serif);font-size:24px;color:var(--gold-l);font-variant-numeric:lining-nums tabular-nums}
.f2{display:grid;gap:10px}
@media(min-width:560px){.f2{grid-template-columns:1fr 1fr}.f2 .full{grid-column:1/-1}}
label.f{display:grid;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;min-width:0}
label.f input{font-size:16px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:13px;width:100%;min-width:0}
label.f input.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(179,38,30,.15)}
.msg{font-size:13px;min-height:18px;color:var(--good);font-weight:600}.msg.err{color:var(--bad)}
.note{font-size:12.5px;color:var(--muted)}
.done{display:grid;gap:10px;text-align:center;padding:18px 6px 6px;justify-items:center}
.done .ck{width:56px;height:56px;border-radius:50%;background:var(--goldgrad);color:var(--gold-ink);display:grid;place-items:center;font-size:28px}
.done h3{font-family:var(--serif);font-size:22px;margin:0}
.done p{margin:0;color:var(--muted);max-width:44ch}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<main id="root"><div class="wrap"><div class="loading">Loading the product list...</div></div></main>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shtitle" aria-hidden="true"></section>
<script>
(function(){
  var LOGO=document.querySelector(".brand img").src;
  var root=document.getElementById("root"), sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
  var CAT=null, Q={}, info={name:"",store:"",phone:"",note:""}, tab="all", term="", KEY="hk-order-v2", sent=false;
  var ICON_S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function money(n){return "$"+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
  function param(k){var m=location.search.match(new RegExp("[?&]"+k+"=([^&]*)"));return m?decodeURIComponent(m[1]):""}
  function all(){var a=[];CAT.groups.forEach(function(g,gi){g.items.forEach(function(it){a.push({g:g,gi:gi,it:it})})});return a}
  function find(id){var r=null;all().forEach(function(x){if(x.it.id===id)r=x});return r}
  function totals(){var u=0,t=0,l=0;all().forEach(function(x){var q=Q[x.it.id]||0;if(q){u+=q;t+=q*x.it.p;l++}});return {u:u,t:t,l:l}}
  function save(){try{localStorage.setItem(KEY+"-"+CAT._id,JSON.stringify({q:Q,i:info}))}catch(e){}}
  function load(){
    var c=(param("c")||"").replace(/[^a-z0-9\-_]/gi,"");
    if(!c){root.innerHTML='<div class="wrap"><div class="loading">This order link is not complete. Please ask H&amp;K for a new link.</div></div>';return}
    var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY+"-"+c)||"null")}catch(e){}
    fetch("catalogs/"+c+".json?"+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
      CAT=j;CAT._id=c;
      if(saved){var ok={};all().forEach(function(x){ok[x.it.id]=x.it.s});Object.keys(saved.q||{}).forEach(function(id){if(ok[id])Q[id]=Math.min(ok[id],saved.q[id])});info=Object.assign(info,saved.i||{})}
      build();
    }).catch(function(){root.innerHTML='<div class="wrap"><div class="loading">This order list could not be loaded. Please ask H&amp;K for a new link.</div></div>'});
  }
  function showP(){return CAT&&CAT.prices!==false}
  function hdr(g){var u=true;g.items.forEach(function(i){if(i.p!==g.items[0].p)u=false});return u&&g.items.length?money(g.items[0].p)+" per box":"Price shown per flavor"}
  function build(){
    
    var n=all().length;
    var h='<section class="herow"><div class="wrap hero"><h1>Sales Order Request</h1><div class="orn"><i></i></div><p>Pick your flavors and quantities, then send your order to H&amp;K on WhatsApp. We confirm every order before it ships.</p>'+
      '<ol class="steps"><li><i>1</i>Choose</li><li><i>2</i>Review</li><li><i>3</i>Send</li></ol><div class="asof">Availability as of '+esc(CAT.date)+'</div></div></section>';
    h+='<div class="tools" id="tools"><div class="wrap"><div class="search">'+ICON_S+'<input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Search flavor" aria-label="Search flavor"><button id="qx" aria-label="Clear search" hidden>&times;</button></div>'+
      '<div class="tabs" role="group" aria-label="Product type"><button class="tab" data-tab="all" aria-pressed="true">All<small>'+n+'</small></button>';
    CAT.groups.forEach(function(g,gi){h+='<button class="tab" data-tab="'+gi+'" aria-pressed="false">'+esc(g.short||g.name)+'<small>'+g.items.length+'</small></button>'});
    h+='</div></div></div><div class="wrap" id="groups">';
    CAT.groups.forEach(function(g,gi){
      h+='<section class="group" data-g="'+gi+'"><div class="ghead"><div><h2>'+esc(g.name)+'</h2>'+(g.sub?'<p>'+esc(g.sub)+'</p>':'')+'</div>'+(showP()?'<span class="gprice">'+hdr(g)+'</span>':'')+'</div><div class="list">';
      g.items.forEach(function(it){h+=rowHtml(it)});
      h+='<div class="none" hidden><b>No flavor found</b>Try a different word.</div></div></section>';
    });
    h+='<div class="foot"><div class="orn"><i></i></div><b>H&amp;K Distribution</b><span>Quantities are in boxes. Pricing and availability are confirmed by H&amp;K when your order is received.</span></div></div>';
    root.innerHTML=h;
    var bar=document.createElement("div");bar.className="bar";bar.innerHTML='<div class="wrap"><div class="tot"><small id="cnt">Nothing selected yet</small><b id="tot">$0.00</b></div><button class="btn primary" id="review" disabled>Review order</button></div>';
    document.body.appendChild(bar);
    upd();
    window.addEventListener("scroll",function(){document.getElementById("tools").classList.toggle("stuck",window.scrollY>140)},{passive:true});
  }
  function rowHtml(it){
    var q=Q[it.id]||0, low=it.s<=5;
    return '<div class="row'+(q?' sel':'')+'" id="r_'+it.id+'" data-f="'+esc(it.f.toLowerCase())+'"><div><div class="fl">'+esc(it.f)+'</div><div class="meta">'+(showP()?'<span class="price">'+money(it.p)+'</span>':'')+'<span class="badge '+(low?'low':'ok')+'">'+(low?'Only '+it.s+' left':'In stock')+'</span></div></div>'+
      '<div class="qty"><button data-m="'+it.id+'" aria-label="Remove one '+esc(it.f)+'"'+(q?'':' disabled')+'>&minus;</button><input inputmode="numeric" pattern="[0-9]*" data-q="'+it.id+'" value="'+(q||"")+'" placeholder="0" aria-label="Quantity of '+esc(it.f)+'"><button data-p="'+it.id+'" aria-label="Add one '+esc(it.f)+'"'+(q>=it.s?' disabled':'')+'>+</button></div></div>';
  }
  function filter(){
    var t=term.trim().toLowerCase();
    document.querySelectorAll(".group").forEach(function(sec){
      var gi=sec.getAttribute("data-g"), show=(tab==="all"||tab===gi), vis=0;
      sec.querySelectorAll(".row").forEach(function(r){var ok=!t||r.getAttribute("data-f").indexOf(t)>-1;r.hidden=!ok;if(ok)vis++});
      sec.hidden=!show||(vis===0&&!!t&&tab==="all");
      var none=sec.querySelector(".none");if(none)none.hidden=!(show&&vis===0&&!!t&&tab!=="all");
    });
    document.getElementById("qx").hidden=!term;
  }
  function paintRow(id){
    var x=find(id);if(!x)return;var q=Q[id]||0;
    var r=document.getElementById("r_"+id);if(r){r.classList.toggle("sel",!!q);var i=r.querySelector("[data-q]");if(i&&document.activeElement!==i)i.value=q||"";r.querySelector("[data-m]").disabled=!q;r.querySelector("[data-p]").disabled=q>=x.it.s}
  }
  function upd(){
    var t=totals();
    document.getElementById("tot").textContent=showP()?money(t.t):(t.u+(t.u===1?" box":" boxes"));
    document.getElementById("cnt").textContent=t.u?(showP()?t.u+(t.u===1?" box":" boxes")+" · ":"")+t.l+(t.l===1?" flavor":" flavors"):"Nothing selected yet";
    document.getElementById("review").disabled=!t.u;
  }
  function setq(id,v,keep){
    var x=find(id);if(!x)return;
    v=Math.max(0,Math.min(x.it.s,parseInt(v,10)||0));
    if(v)Q[id]=v;else delete Q[id];
    paintRow(id);save();upd();if(sheet.classList.contains("on")&&!keep)renderSheet(true);
  }
  function ensureRef(){if(!info.ref){var d=new Date(),a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r="";for(var i=0;i<4;i++)r+=a.charAt(Math.floor(Math.random()*a.length));info.ref=("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"-"+r;save()}return info.ref}
  function nowStr(){var d=new Date();return d.toLocaleDateString("en-US")+" "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
  function makePdf(){
    var J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
    ensureRef();var t=totals(),doc=new J({unit:"pt",format:"letter"}),W=612;
    doc.setFillColor(20,18,12);doc.rect(0,0,W,98,"F");doc.setFillColor(184,143,18);doc.rect(0,98,W,3,"F");
    try{var im=document.querySelector(".brand img"),r=(im.naturalWidth||3)/(im.naturalHeight||1),h=34,w=Math.min(110,h*r);doc.setFillColor(255,255,255);doc.roundedRect(40,26,w+16,h+16,6,6,"F");doc.addImage(LOGO,"PNG",48,34,w,h)}catch(e){}
    doc.setFont("times","bold");doc.setFontSize(20);doc.setTextColor(226,194,90);doc.text("SALES ORDER REQUEST",W-40,52,{align:"right"});
    doc.setFont("times","normal");doc.setFontSize(10);doc.setTextColor(230,224,200);doc.text("#"+info.ref+"    "+nowStr(),W-40,74,{align:"right"});
    doc.setTextColor(20,18,12);doc.setFont("times","bold");doc.setFontSize(15);doc.text(CAT.title,40,134);
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(60,56,40);
    var y=154,rows=[["Customer",info.store||"-"]];if(info.phone)rows.push(["Phone",info.phone]);
    rows.forEach(function(x){doc.setFont("helvetica","bold");doc.text(x[0],40,y);doc.setFont("helvetica","normal");doc.text(String(x[1]),100,y);y+=16});
    var body=[];
    CAT.groups.forEach(function(g){var first=true;g.items.forEach(function(it){var q=Q[it.id]||0;if(!q)return;if(first){body.push([{content:g.name,colSpan:(showP()?4:2),styles:{fillColor:[246,236,201],fontStyle:"bold",textColor:[20,18,12]}}]);first=false}body.push(showP()?[it.f,String(q),money(it.p),money(q*it.p)]:[it.f,String(q)])})});
    doc.autoTable({startY:y+8,head:[showP()?["Flavor","Qty","Price","Total"]:["Flavor","Qty"]],body:body,foot:[showP()?[{content:"TOTAL  -  "+t.u+(t.u===1?" box":" boxes"),colSpan:3,styles:{halign:"right"}},money(t.t)]:[{content:"TOTAL",styles:{halign:"right"}},String(t.u)]],theme:"grid",
      styles:{font:"helvetica",fontSize:10,cellPadding:5,lineColor:[221,214,186],lineWidth:.4,textColor:[30,28,18]},
      headStyles:{fillColor:[20,18,12],textColor:[226,194,90],fontStyle:"bold"},footStyles:{fillColor:[20,18,12],textColor:[226,194,90],fontStyle:"bold",fontSize:11},
      columnStyles:showP()?{0:{cellWidth:"auto"},1:{halign:"center",cellWidth:50},2:{halign:"right",cellWidth:70},3:{halign:"right",cellWidth:80}}:{0:{cellWidth:"auto"},1:{halign:"center",cellWidth:80}},margin:{left:40,right:40,bottom:60}});
    var yy=doc.lastAutoTable.finalY+18;
    if(info.note){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(60,56,40);doc.text("Note: ",40,yy);doc.setFont("helvetica","normal");doc.text(doc.splitTextToSize(info.note,460),72,yy)}
    var n=doc.getNumberOfPages();for(var i=1;i<=n;i++){doc.setPage(i);doc.setFont("times","italic");doc.setFontSize(9);doc.setTextColor(110,106,88);doc.text("Availability as of "+CAT.date+". Orders and pricing are confirmed by H&K before shipping.",40,770);doc.text("Page "+i+" of "+n,W-40,770,{align:"right"})}
    return doc;
  }
  function pdfName(){return "HK-Order-"+ensureRef()+".pdf"}
  function sendPdf(){
    var doc=makePdf();if(!doc){msgSet("Could not make the PDF. Please use Send as text.",true);return}
    var blob=doc.output("blob"),file=new File([blob],pdfName(),{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"H&K sales order request "+info.ref,text:msg()}).then(function(){doneSheet("shared")}).catch(function(e){if(e&&e.name==="AbortError")return;doc.save(pdfName());msgSet("PDF saved on your device. Attach it in WhatsApp.")});
    }else{doc.save(pdfName());msgSet("PDF saved. Now open WhatsApp and attach it, or use Send as text.");}
  }
  function msg(){
    var t=totals(), L=[];
    ensureRef();L.push("*SALES ORDER REQUEST*  |  "+(CAT.brand||CAT.title)+"  |  #"+info.ref);
    L.push("*CUSTOMER: "+(info.store||"-")+"*");
    if(info.phone)L.push("Tel: "+info.phone);
    CAT.groups.forEach(function(g){
      var lines=[];g.items.forEach(function(it){var q=Q[it.id]||0;if(q)lines.push(q+" x "+it.f+(showP()?"  -  "+money(q*it.p):""))});
      if(lines.length){L.push("");L.push("*"+(g.short||g.name).toUpperCase()+"*");lines.forEach(function(x){L.push(x)})}
    });
    L.push("");L.push("*TOTAL: "+t.u+(t.u===1?" box":" boxes")+(showP()?"  -  "+money(t.t):"")+"*");
    if(info.note){L.push("");L.push("Note: "+info.note)}
    return L.join("\n");
  }
  function openSheet(){sent=false;renderSheet();sheet.classList.add("on");scrim.classList.add("on");sheet.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
  function closeSheet(){sheet.classList.remove("on");scrim.classList.remove("on");sheet.setAttribute("aria-hidden","true");document.body.style.overflow=""}
  function renderSheet(keepFocus){
    var t=totals();
    if(!t.u){closeSheet();return}
    var h='<div class="sh-head"><h2 id="shtitle">Review your order</h2><button class="x" id="shx" aria-label="Close">&times;</button></div><div class="sh-body"><div class="lines">';
    all().forEach(function(x){var q=Q[x.it.id]||0;if(!q)return;
      h+='<div class="ln"><div><div class="n">'+esc(x.it.f)+'</div><div class="s">'+esc(x.g.short||x.g.name)+(showP()?' · '+money(x.it.p)+' each':'')+'</div></div><div class="t">'+(showP()?money(q*x.it.p):'')+'</div>'+
        '<div class="qty"><button data-m="'+x.it.id+'" aria-label="Remove one">&minus;</button><input inputmode="numeric" pattern="[0-9]*" data-q="'+x.it.id+'" value="'+q+'" aria-label="Quantity"><button data-p="'+x.it.id+'" aria-label="Add one"'+(q>=x.it.s?' disabled':'')+'>+</button></div></div>'});
    h+='<div class="sum"><span>Total</span><b>'+(showP()?t.u+(t.u===1?' box':' boxes')+' · '+money(t.t):t.u+(t.u===1?' box':' boxes'))+'</b></div></div>';
    h+='<div class="f2"><label class="f full">Customer account name<input id="in_store" autocomplete="organization" value="'+esc(info.store)+'" placeholder="Your account name with H&amp;K"></label>'+
       '<label class="f full">Note (optional)<input id="in_note" value="'+esc(info.note)+'" placeholder="Delivery or pickup, anything else"></label></div>';
    h+='<div class="note"><b>Send order as PDF</b> makes a neat order sheet; choose H&amp;K in WhatsApp and press Send. <b>Send as WhatsApp message</b> opens our chat with the order typed in. Your WhatsApp number is sent with it, so we can reach you. H&amp;K confirms the order and final availability.</div></div>';
    h+='<div class="sh-foot"><div class="msg" id="msg" role="status"></div><button class="btn primary wide" id="sendpdf">Send order as PDF</button><button class="btn wide" id="send">Send as WhatsApp message</button><button class="btn wide" id="copy">Copy order text</button></div>';
    sheet.innerHTML=h;
    if(!keepFocus){var x=document.getElementById("shx");if(x)x.focus()}
  }
  function msgSet(t,err){var m=document.getElementById("msg");if(m){m.textContent=t;m.className="msg"+(err?" err":"")}}
  function need(){
    var ok=true;["in_store"].forEach(function(id){var e=document.getElementById(id);var v=e&&e.value.trim();if(e)e.classList.toggle("err",!v);if(!v)ok=false});
    if(!ok){msgSet("Please type your customer account name.",true);var e=document.getElementById("in_store");if(e)e.focus()}
    return ok;
  }
  function doneSheet(kind){
    sheet.innerHTML='<div class="sh-head"><h2 id="shtitle">Almost done</h2><button class="x" id="shx" aria-label="Close">&times;</button></div><div class="sh-body"><div class="done"><div class="ck">&#10003;</div><h3>WhatsApp is open</h3><p>Your order is written in the message. Press <b>Send</b> in WhatsApp to finish. If WhatsApp did not open, copy the order and send it to H&amp;K.</p></div></div><div class="sh-foot"><button class="btn primary wide" id="send2">Open WhatsApp again</button><button class="btn wide" id="copy">Copy order text</button><button class="btn wide" id="back">Back to the order</button><div class="msg" id="msg" role="status"></div></div>';
  }
  function wa(){
    var base=CAT.phone?"https://wa.me/"+String(CAT.phone).replace(/\D/g,"")+"?text=":"https://wa.me/?text=";
    window.open(base+encodeURIComponent(msg()),"_blank");
  }
  function copy(){
    var txt=msg();
    function ok(){msgSet("Copied. Paste it into a message to H&K.")}
    function fb(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){msgSet("Could not copy. Please select the text and copy it.",true)}document.body.removeChild(ta)}
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.tab!==undefined){tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-pressed",String(t===b))});filter();return}
    if(b.dataset.p){setq(b.dataset.p,(Q[b.dataset.p]||0)+1);return}
    if(b.dataset.m){setq(b.dataset.m,(Q[b.dataset.m]||0)-1);return}
    if(b.id==="qx"){var q=document.getElementById("q");q.value="";term="";filter();q.focus();return}
    if(b.id==="review"){openSheet();return}
    if(b.id==="shx"||b.id==="back"){if(b.id==="back"){renderSheet();return}closeSheet();return}
    if(b.id==="sendpdf"){info.store=(document.getElementById("in_store").value||"").trim();info.note=(document.getElementById("in_note").value||"").trim();save();if(!need())return;sendPdf();return}
    if(b.id==="send"||b.id==="send2"){ if(b.id==="send"){info.store=(document.getElementById("in_store").value||"").trim();info.note=(document.getElementById("in_note").value||"").trim();save();if(!need())return} wa();doneSheet();return}
    if(b.id==="copy"){var n=document.getElementById("in_store");if(n){info.store=n.value.trim();info.note=document.getElementById("in_note").value.trim();save();if(!need())return}copy();return}
  });
  scrim.addEventListener("click",closeSheet);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheet.classList.contains("on"))closeSheet()});
  document.addEventListener("input",function(e){
    var el=e.target;
    if(el.id==="q"){term=el.value;filter();return}
    if(el.dataset&&el.dataset.q){var id=el.dataset.q,v=parseInt(el.value,10);var x=find(id);if(isNaN(v)||v<=0){delete Q[id]}else{Q[id]=Math.min(x.it.s,v)}paintRow(id);save();upd();return}
    if(el.id==="in_store"){el.classList.remove("err")}
  });
  document.addEventListener("change",function(e){var el=e.target;if(el.dataset&&el.dataset.q){var id=el.dataset.q;el.value=Q[id]||"";if(sheet.classList.contains("on"))renderSheet(true)}});
  load();
})();
</script>
</body>
